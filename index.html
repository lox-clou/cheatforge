<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CheatForge // Real Builds</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#e0e0e0;font-family:monospace;min-height:100vh}
.top{padding:28px;text-align:center;border-bottom:1px solid #222}
.top h1{font-size:34px;background:linear-gradient(90deg,#00f0ff,#bd00ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.top p{color:#666;margin-top:6px;font-size:12px}
.grid{display:grid;grid-template-columns:300px 1fr 320px;gap:16px;padding:20px}
.panel{background:#12121a;border:1px solid #222;border-radius:8px;padding:16px;overflow-y:auto;max-height:86vh}
h2{font-size:11px;color:#666;text-transform:uppercase;letter-spacing:2px;margin-bottom:12px}
.game{padding:12px;margin:6px 0;background:#1a1a24;border:1px solid #222;border-radius:6px;cursor:pointer;transition:.2s}
.game:hover{border-color:#00f0ff}
.game.active{border-color:#00f0ff;background:rgba(0,240,255,.05)}
.game b{color:#00f0ff}
.badge{display:inline-block;font-size:9px;padding:2px 6px;border-radius:3px;margin-top:4px}
.b-mem{background:rgba(0,240,255,.15);color:#00f0ff}
.b-screen{background:rgba(189,0,255,.15);color:#d580ff}
.b-input{background:rgba(0,255,136,.15);color:#00ff88}
.feat{padding:10px;margin:6px 0;background:#1a1a24;border:1px solid #222;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:10px}
.feat.on{border-color:#00f0ff;background:rgba(0,240,255,.05)}
.chk{width:16px;height:16px;border:2px solid #444;border-radius:3px;flex-shrink:0}
.feat.on .chk{background:#00f0ff;border-color:#00f0ff}
.btn{width:100%;padding:14px;margin:8px 0;background:linear-gradient(90deg,#00f0ff,#bd00ff);border:none;border-radius:6px;color:#000;font-weight:bold;cursor:pointer;font-size:13px}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.4;cursor:not-allowed}
.term{background:#000;border:1px solid #222;border-radius:6px;padding:10px;font-size:11px;height:150px;overflow-y:auto;margin-top:10px;display:none}
.term.show{display:block}
.term .ok{color:#00ff88}
.term .err{color:#ff3860}
.note{font-size:10px;color:#555;margin-top:10px;line-height:1.5}
.cnt{color:#00f0ff}
</style>
</head>
<body>
<div class="top"><h1>CHEATFORGE</h1><p>real per-game binaries · compiled in CI-free box · no stubs</p></div>
<div class="grid">
<div class="panel"><h2>Game</h2><div id="games"></div></div>
<div class="panel"><h2>Features compiled into this binary</h2><div id="feats"></div><div class="note" id="mech"></div></div>
<div class="panel">
<h2>Build</h2>
<div style="font-size:12px;margin-bottom:8px">selected: <span class="cnt" id="cnt">0</span></div>
<button class="btn" id="build">DOWNLOAD REAL CHEAT (.zip)</button>
<div class="term" id="term"></div>
<div class="note" id="src"></div>
</div>
</div>
<script>
const RAW="https://raw.githubusercontent.com/lox-clou/cheatforge/main/builds/";
const GAMES={
cs2:{n:"Counter-Strike 2",proc:"cs2.exe",tier:"mem",mech:"memory tier: ReadProcessMemory + view matrix W2S, offsets pulled from cs2-dumper at compile time. write-handles open only per-write, read jitter 2-6ms.",f:[["esp","ESP boxes + HP","memory read"],["aimbot","Aimbot","mouse-input aim"],["triggerbot","Triggerbot","crosshair entity id"],["bhop","Bhop","forceJump write"],["rcs","RCS","aim punch compensation"],["radar","Radar","minimap dots"],["remove_flash","No flash","flash alpha reset"]]},
valorant:{n:"Valorant",proc:"VALORANT-Win64-Shipping.exe",tier:"screen",mech:"screen+input tier: zero memory reads. targets come from enemy outline color, aim/trigger via input. needs borderless + enemy highlight on.",f:[["esp","Color ESP","outline capture"],["triggerbot","Triggerbot","crosshair pixel"],["rcs","Recoil macro","pattern per spray"]]},
rust:{n:"Rust",proc:"RustClient.exe",tier:"input",mech:"input tier: zero memory reads, pure input-level macros. works in any render mode.",f:[["rcs","Recoil macro","AK pattern"],["rapid_fire","Rapid fire","click repeater"],["bhop","Bhop","input hop"]]},
apex:{n:"Apex Legends",proc:"r5apex.exe",tier:"screen",mech:"screen+input tier: enemy glow as target source, zero memory reads. needs borderless + glow on.",f:[["esp","Color ESP","glow capture"],["aimbot","Color aim","glow centroid"],["triggerbot","Triggerbot","crosshair pixel"]]},
pubg:{n:"PUBG",proc:"TslGame.exe",tier:"screen",mech:"screen+input tier: enemy outline as target source, zero memory reads. needs borderless + outline on.",f:[["esp","Color ESP","outline capture"],["triggerbot","Triggerbot","crosshair pixel"],["rcs","Recoil macro","M416 pattern"]]},
fortnite:{n:"Fortnite",proc:"FortniteClient-Win64-Shipping.exe",tier:"input",mech:"input tier: zero memory reads, pure input-level macros.",f:[["rcs","Recoil macro","AR pattern"],["rapid_fire","Rapid fire","click repeater"],["bhop","Bhop","input hop"]]},
gta5:{n:"GTA V",proc:"GTA5.exe",tier:"input",mech:"input tier: zero memory reads, pure input-level macros.",f:[["rapid_fire","Rapid fire","click repeater"],["rcs","Recoil macro","generic pattern"]]},
minecraft:{n:"Minecraft",proc:"javaw.exe",tier:"screen",mech:"screen+input tier: white nametags as target source, zero memory reads (JVM heap untouched).",f:[["esp","Color ESP","nametag capture"],["triggerbot","Triggerbot","crosshair pixel"],["rapid_fire","Rapid fire","CPS boost"],["bhop","Bhop","input hop"]]},
tf2:{n:"Team Fortress 2",proc:"hl2.exe",tier:"screen",mech:"screen+input tier: red team color as target source, zero memory reads.",f:[["esp","Color ESP","team color capture"],["triggerbot","Triggerbot","crosshair pixel"],["bhop","Bhop","input hop"]]}
};
let cur="cs2",sel={};Object.keys(GAMES).forEach(k=>sel[k]=new Set());
const $=id=>document.getElementById(id);
function R(){
$("games").innerHTML=Object.entries(GAMES).map(([k,v])=>`<div class="game ${k===cur?'active':''}" data-g="${k}"><b>${v.n}</b><br><small style="color:#666">${v.proc}</small><br><span class="badge b-${v.tier}">${v.tier==="mem"?"MEMORY RPM/WPM":v.tier==="screen"?"SCREEN+INPUT":"INPUT ONLY"}</span></div>`).join("");
document.querySelectorAll(".game").forEach(e=>e.onclick=()=>{cur=e.dataset.g;R()});
const v=GAMES[cur];
$("feats").innerHTML=v.f.map(f=>`<div class="feat ${sel[cur].has(f[0])?'on':''}" data-n="${f[0]}"><div class="chk"></div><div><b>${f[1]}</b><br><small style="color:#666">${f[2]}</small></div></div>`).join("");
document.querySelectorAll(".feat").forEach(e=>e.onclick=()=>{const n=e.dataset.n;sel[cur].has(n)?sel[cur].delete(n):sel[cur].add(n);R()});
$("mech").textContent=v.mech;
$("cnt").textContent=sel[cur].size;
$("src").textContent="source: "+RAW+"CheatForge_"+cur+".exe";
}
function log(m,t){const T=$("term");T.classList.add("show");const d=document.createElement("div");d.className=t||"";d.textContent="> "+m;T.appendChild(d);T.scrollTop=T.scrollHeight}
$("build").onclick=async()=>{
const feats=[...sel[cur]];
if(!feats.length){log("select at least one compiled feature","err");return}
const btn=$("build");btn.disabled=true;btn.textContent="PACKING...";
log("fetching compiled binary for "+cur+"...");
let blob;
try{
const r=await fetch(RAW+"CheatForge_"+cur+".exe?ts="+Date.now());
if(!r.ok)throw new Error("HTTP "+r.status);
blob=await r.blob();
}catch(e){log("fetch failed: "+e.message,"err");log("binary missing in builds/ - run cheat-fw/build.sh and push","err");btn.disabled=false;btn.textContent="DOWNLOAD REAL CHEAT (.zip)";return}
log("binary ok: "+(blob.size/1024).toFixed(0)+" KB");
const cfg={game:cur,features:feats,tier:GAMES[cur].tier,built:Date.now()};
const readme="CheatForge real build\n=====================\ngame: "+GAMES[cur].n+"\nprocess: "+GAMES[cur].proc+"\ntier: "+GAMES[cur].tier+"\nfeatures: "+feats.join(", ")+"\n\n1) unpack ALL files into ONE folder\n2) start the game\n3) run CheatForge_"+cur+".exe as administrator\n4) keep config.json next to the exe - it gates which features turn on\n5) END key = exit\n\n"+GAMES[cur].mech+"\n";
const zip=new JSZip();
zip.file("CheatForge_"+cur+".exe",blob);
zip.file("config.json",JSON.stringify(cfg,null,2));
zip.file("README.txt",readme);
log("zipping exe + config.json + README...");
saveAs(await zip.generateAsync({type:"blob"}),"CheatForge_"+cur+"_real.zip");
log("done: CheatForge_"+cur+"_real.zip","ok");
btn.disabled=false;btn.textContent="DOWNLOAD REAL CHEAT (.zip)";
};
R();
</script>
</body>
</html>
